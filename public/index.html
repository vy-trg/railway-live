<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Live – Brisbane Trains</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        /* Full-screen map; dvh keeps it correct when the phone's address bar shows/hides */
        #map {
            height: 100vh;
            height: 100dvh;
            width: 100%;
        }

        /* Status banner floats over the map, to the right of the zoom buttons */
        #status-banner {
            position: fixed;
            top: 10px;
            left: 56px;
            right: 10px;
            max-width: 360px;
            z-index: 1000;
            padding: 8px 12px;
            border-radius: 6px;
            font: 14px/1.4 system-ui, sans-serif;
            background: #fff;
            color: #1d2433;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        #status-banner.ok {
            background: #d4edda;
        }

        #status-banner.stale {
            background: #fff3cd;
        }

        #status-banner.error {
            background: #f8d7da;
        }
    </style>
</head>

<body>
    <!-- role="status" lets screen readers announce each update -->
    <div id="status-banner" role="status">Loading train data…</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- The map code lives in its own file so the security policy can block inline scripts -->
    <script src="/app.js"></script>
</body>

</html>
