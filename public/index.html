<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Live · South East Queensland trains, trams and ferries</title>
    <meta name="description" content="Live map, departures and delays for South East Queensland trains, the G:link tram and Brisbane ferries, from TransLink open data.">
    <meta name="theme-color" content="#f4ecdf">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header class="top">
        <a class="brand" href="/">
            <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>
                <b>Railway Live</b>
                <small>Trains, trams &amp; ferries · South East Queensland</small>
            </span>
        </a>
        <!-- How fresh the data is. role="status" is read out when it changes. -->
        <p id="feed-status" class="feed" role="status"><span class="dot"></span><span class="feed-text">Connecting to TransLink…</span></p>
    </header>

    <!-- Reminder messages; role="alert" so screen readers announce them straight away -->
    <p id="banner" class="banner" role="alert" hidden></p>

    <div class="app">
        <!-- Map with the coloured track lines -->
        <section class="map-wrap" aria-label="Live map">
            <div id="map"></div>
            <ul class="legend" aria-label="What the marker colours mean">
                <li><i class="lv-ontime"></i>On time</li>
                <li><i class="lv-late"></i>2–5 min late</li>
                <li><i class="lv-verylate"></i>5+ min late</li>
                <li class="legend-shapes" aria-label="Marker shapes: circle train, square tram, diamond ferry"><i class="shape-train"></i>Train <i class="shape-tram"></i>Tram <i class="shape-ferry"></i>Ferry</li>
            </ul>

            <!-- One train's journey, shown when a train is picked -->
            <article id="journey" class="journey" hidden aria-live="polite">
                <header class="journey-head">
                    <span id="journey-line" class="line-pill"></span>
                    <button id="journey-close" class="icon-btn" type="button" aria-label="Close journey">×</button>
                </header>
                <h2 id="journey-title"></h2>
                <p id="journey-sub" class="muted"></p>
                <ol id="journey-stops" class="stops"></ol>
            </article>
        </section>

        <aside class="panel">
            <nav class="tabs" role="tablist" aria-label="Sections">
                <button role="tab" id="tab-trains" aria-controls="view-trains" aria-selected="true" type="button">Live</button>
                <button role="tab" id="tab-board" aria-controls="view-board" aria-selected="false" type="button">Departures</button>
                <button role="tab" id="tab-alerts" aria-controls="view-alerts" aria-selected="false" type="button">Alerts <span id="alerts-count" class="count"></span></button>
                <button role="tab" id="tab-stats" aria-controls="view-stats" aria-selected="false" type="button">Stats</button>
            </nav>

            <!-- Trains: network numbers, line filter, list of trains -->
            <section id="view-trains" class="view" role="tabpanel" aria-labelledby="tab-trains">
                <!-- One line of numbers instead of four boxes: the list below already shows which trains are late -->
                <p class="summary"><span id="kpi-running">–</span> running · <b id="kpi-ontime">–</b> on time<span id="kpi-delay-wrap"> · late ones about <b id="kpi-delay">–</b></span></p>
                <!-- Pick a kind of service; the line filter below narrows it further -->
                <div class="seg" id="mode-seg" role="group" aria-label="Show">
                    <button type="button" data-mode="" aria-pressed="true">All</button>
                    <button type="button" data-mode="train" aria-pressed="false">Trains</button>
                    <button type="button" data-mode="tram" aria-pressed="false">Tram</button>
                    <button type="button" data-mode="ferry" aria-pressed="false">Ferries</button>
                </div>
                <div class="filter">
                    <label class="visually-hidden" for="line-filter">Line</label>
                    <input id="line-filter" list="line-list" placeholder="Filter by line, e.g. Springfield or Ferry F1" autocomplete="off">
                    <datalist id="line-list"></datalist>
                    <button id="line-clear" type="button" class="link-btn" hidden>Clear</button>
                </div>
                <p id="filter-note" class="filter-note" role="status"></p>
                <ul id="train-list" class="train-list" aria-busy="true"><li class="skeleton-row" aria-hidden="true"></li><li class="skeleton-row" aria-hidden="true"></li><li class="skeleton-row" aria-hidden="true"></li><li class="skeleton-row" aria-hidden="true"></li></ul>
            </section>

            <!-- Next trains from one station -->
            <section id="view-board" class="view" role="tabpanel" aria-labelledby="tab-board" hidden>
                <!-- Type to search or scroll the list: 154 stations is too many for a plain dropdown -->
                <label class="field-label" for="station-input">Departures from</label>
                <input id="station-input" class="station-input" list="station-list" autocomplete="off" placeholder="Type a station, e.g. Roma Street">
                <datalist id="station-list"></datalist>
                <p id="station-error" class="field-error" role="alert" hidden></p>
                <!-- Now, or plan ahead: any time in the next 7 days -->
                <div class="when">
                    <label class="field-label" for="when-input">Leaving</label>
                    <input id="when-input" class="station-input" type="datetime-local" step="300">
                    <button id="when-now" type="button" class="link-btn" hidden>Back to now</button>
                </div>
                <p id="when-note" class="filter-note" role="status"></p>
                <ul id="board" class="board" aria-busy="true"><li class="skeleton-row" aria-hidden="true"></li><li class="skeleton-row" aria-hidden="true"></li><li class="skeleton-row" aria-hidden="true"></li><li class="skeleton-row" aria-hidden="true"></li></ul>
            </section>

            <!-- On-time history, recorded every 10 minutes -->
            <section id="view-stats" class="view" role="tabpanel" aria-labelledby="tab-stats" hidden>
                <div class="seg" role="group" aria-label="Period">
                    <button type="button" data-days="1">Today</button>
                    <button type="button" data-days="7" aria-pressed="true">7 days</button>
                    <button type="button" data-days="30">30 days</button>
                </div>
                <div id="stats" aria-busy="true"><div class="skeleton-row tall" aria-hidden="true"></div><div class="skeleton-row tall" aria-hidden="true"></div></div>
            </section>

            <!-- Rail alerts -->
            <section id="view-alerts" class="view" role="tabpanel" aria-labelledby="tab-alerts" hidden>
                <ul id="alerts" class="alerts" aria-busy="true"><li class="skeleton-row tall" aria-hidden="true"></li><li class="skeleton-row tall" aria-hidden="true"></li><li class="skeleton-row tall" aria-hidden="true"></li></ul>
            </section>

            <footer class="foot">
                Data: <a href="https://translink.com.au/about-translink/open-data">TransLink</a> (CC BY 4.0) ·
                Map © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ·
                <a href="https://github.com/vy-trg/railway-live">Source</a>
            </footer>
        </aside>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- The page code lives in its own file so the security policy can block inline scripts -->
    <script src="/app.js"></script>
</body>

</html>
