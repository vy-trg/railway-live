<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Live - Brisbane Trains</title>

    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* Map container taking full viewport height */
        #map {
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>
<body>

    <!-- Status banner element placed correctly inside the body -->
    <div id="status-banner" style="position: fixed; top: 10px; left: 50px; z-index: 1000; background: white; padding: 8px 12px; border-radius: 6px; font-family: sans-serif; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);">
        Loading train data...
    </div>

    <!-- Map container element -->
    <div id="map"></div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Setting up the map: Initialize map centered at Brisbane with zoom level 11
        const map = L.map('map').setView([-27.47, 153.02], 11);

        // Add OpenStreetMap tile layer with required attribution
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Store active markers in a Map object (Key: train ID, Value: Leaflet Marker)
        const trainMarkers = new Map();

        // Function to fetch train data from backend API and update map markers
        async function loadTrains() {
            const banner = document.getElementById('status-banner');

            try {
                const response = await fetch('/api/trains');
                const data = await response.json();

                const currentTrainIds = new Set();

                data.trains.forEach(train => {
                    currentTrainIds.add(train.id);

                    if (trainMarkers.has(train.id)) {
                        // Update existing marker position smoothly without re-creating it
                        const marker = trainMarkers.get(train.id);
                        marker.setLatLng([train.lat, train.lng]);
                    } else {
                        // Create a new circle marker for a new train
                        const marker = L.circleMarker([train.lat, train.lng], {
                            radius: 6,
                            color: '#2f5fd0',
                            fillColor: '#6f95ff',
                            fillOpacity: 0.8
                        }).addTo(map);

                        // Bind a popup showing the train ID and trip ID
                        marker.bindPopup(`<b>Train ID:</b> ${train.id}<br><b>Trip ID:</b> ${train.tripId || 'N/A'}`);

                        trainMarkers.set(train.id, marker);
                    }
                });

                // Remove markers of trains that are no longer active in the feed
                trainMarkers.forEach((marker, id) => {
                    if (!currentTrainIds.has(id)) {
                        map.removeLayer(marker);
                        trainMarkers.delete(id);
                    }
                });

                // Update status banner based on data source
                if (data.source === "stale-cache") {
                    banner.style.background = "#fff3cd"; // Warning yellow
                    banner.innerText = `⚠️ Feed error. Showing stale data from: ${new Date(data.updatedAt).toLocaleTimeString('en-AU', { timeZone: 'Australia/Brisbane' })}`;
                } else {
                    banner.style.background = "#d4edda"; // Success green
                    banner.innerText = `✅ Last updated: ${new Date(data.updatedAt).toLocaleTimeString('en-AU', { timeZone: 'Australia/Brisbane' })}`;
                }

                console.log(`Trains updated at ${data.updatedAt} (Source: ${data.source})`);
            } catch (error) {
                console.error("Failed to load train positions:", error);
                // Update banner to show connection or server error
                banner.style.background = "#f8d7da"; // Danger red
                banner.innerText = `❌ Failed to connect to server. Retrying...`;
            }
        }

        // Initial load when the page opens
        loadTrains();

        // Dealing with events: Refresh train positions every 30 seconds automatically
        setInterval(loadTrains, 30000);
    </script>
</body>
</html>
