name: Record delays
# Every 10 minutes, save how late each running train is (GitHub may start it a few minutes late)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/record-delays.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
