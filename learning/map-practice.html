<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Quick Start - Map Practice</title>
    
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
          
    <!-- Leaflet JavaScript CDN (Must be placed right AFTER the CSS link) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <style>
        /* Set explicit height for the map container (changed to 400px for better visibility) */
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Preparing your page: map container div -->
    <div id="map"></div>

    <script>
        // Setting up the map: Initialize the map centered at Brisbane with zoom level 13
        const map = L.map('map').setView([-27.47, 153.02], 13);

        // Add OpenStreetMap tile layer with required attribution
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Markers, circles, and polygons: Add a marker at Central Station, Brisbane
        const marker = L.marker([-27.466, 153.026]).addTo(map);

        // Working with popups: Bind a popup to the marker and open it
        marker.bindPopup("<b>Central Station</b><br>Brisbane").openPopup();
    </script>

</body>
</html>
